<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perdóname, Jorge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Pacifico&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<section id="intro">
  <div class="glow" id="glow"></div>
  <h1 class="logo">JORGE<span>VI</span></h1>
  <p class="intro-sub">Coming soon… a tu corazón</p>
  <div class="loader"><i id="loadBar"></i></div>
  <p id="loadText">Cargando… 0%</p>
  <button id="startBtn" class="btn start hidden">Presiona para empezar</button>
</section>

<main id="scene" class="hidden">
  <div class="stars" id="stars"></div>
  <div class="sun" id="sun"></div>
  <div class="layer" id="city"></div>
  <div class="layer" id="palms"></div>
  <div class="siren" id="siren"></div>

  <header class="hud">
    <div class="mission">Misión · Reconquistar a Jorge</div>
    <div class="wanted" id="wanted" aria-label="Nivel de búsqueda"></div>
  </header>

  <section class="card" id="card">
    <div class="card-inner">
      <h2 class="title" id="title">Jorge</h2>
      <p class="letter" id="letter"></p>
      <h3 class="ask hidden" id="ask">¿Me perdonas?</h3>
      <div class="buttons hidden" id="buttons">
        <button id="yesBtn" class="btn yes">Sí</button>
        <button id="noBtn" class="btn no">No</button>
      </div>
      <p class="status" id="status"></p>
    </div>
  </section>

  <div class="road"><div class="lane" id="lane"></div></div>
  <div id="toasts"></div>

  <section id="win" class="hidden">
    <h2 class="passed">MISIÓN CUMPLIDA</h2>
    <p class="respect">Respeto +100 · Nivel de búsqueda eliminado</p>
    <p class="love" id="love"></p>
    <p class="love2">Gracias por perdonarme, Jorge.</p>
    <button id="replayBtn" class="btn small">Jugar otra vez</button>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
